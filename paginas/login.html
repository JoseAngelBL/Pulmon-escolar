<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="stilos-login.css">
</head>

<body>
    <div class="login-contenedor">
        <!-- Sección lateral izquierda -->
        <aside class="contacto">
            <h2>Contáctanos</h2>
            <p>Ofinica principal: Calle 91a ## 70 - 193</p>
            <p>Oficina segundaria: Cra. 59 #27B-510</p>
            <p>Ubicacion: Medellín, Colombia</p>
            <p>Gmail: pulmonescolar@gmail.com</p>
            <p>Whatsapp: 3006012847</p>
        </aside>

        <!-- Sección de inicio de sesión -->
        <section class="formulario-login">
            <img src="imagenes-paginas/ChatGPT Image 5 jun 2025, 15_21_52.png" alt="Logo" class="logo">
            <h1 class="titulo">Pulmon Escolar</h1>
            <h3 class="lema">Respira pleno</h3>
            <h2 class="subtitulo">Iniciar Sesión</h2>

            <form id="loginForm">
                <input type="text" id="usuario" placeholder="Usuario">
                <input type="password" id="contrasena" placeholder="Contraseña">
                <button type="submit">Ingresar</button>
                <p id="mensaje"></p>
            </form>
        </section>
    </div>
</body>
<script>
    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();

        const username = document.getElementById("usuario").value;
        const password = document.getElementById("contrasena").value;

        try {
            const res = await fetch("http://localhost/PULMON-ESCOLAR/backend/login.php", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    username,
                    password
                })
            });

            // Lee la respuesta JSON una sola vez y la guarda en la variable 'data'
            const data = await res.json();
            console.log(data); // Muestra los datos en la consola

            document.getElementById("mensaje").innerText = data.message;
            if (data.success) {
                document.getElementById("mensaje").style.color = "green";
                // Asegúrate de que la palabra "location" esté bien escrita
                window.location.href = "admin.html";
            } else {
                document.getElementById("mensaje").style.color = "red";
            }
        } catch (error) {
            // Este bloque ahora solo se ejecutará si la conexión falla o el JSON no es válido
            console.error("Error al procesar la respuesta:", error);
            document.getElementById("mensaje").innerText = "Error de conexión con el servidor.";
            document.getElementById("mensaje").style.color = "red";
        }
    });
</script>

</html>
